<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nalam Snacks - Order Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-12">
    
    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        
        <!-- Header & Filters -->
        <div class="bg-white rounded-xl shadow-sm p-6 mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4 border border-gray-200">
            <div>
                <h1 class="text-2xl font-black text-orange-600">Nalam Snacks</h1>
                <p class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Order Dashboard</p>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="flex flex-col">
                    <label class="text-xs font-bold text-gray-500 mb-1">From Date</label>
                    <input type="date" id="fromDate" class="border border-gray-300 rounded-lg px-3 py-2 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <div class="flex flex-col">
                    <label class="text-xs font-bold text-gray-500 mb-1">To Date</label>
                    <input type="date" id="toDate" class="border border-gray-300 rounded-lg px-3 py-2 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200 flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center text-green-600 text-xl">
                    <i class="fas fa-rupee-sign"></i>
                </div>
                <div>
                    <p class="text-sm font-bold text-gray-500 uppercase">Total Revenue</p>
                    <p id="totalRevenue" class="text-2xl font-black text-gray-900">₹0</p>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200 flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-xl">
                    <i class="fas fa-shopping-bag"></i>
                </div>
                <div>
                    <p class="text-sm font-bold text-gray-500 uppercase">Total Orders</p>
                    <p id="totalOrders" class="text-2xl font-black text-gray-900">0</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Order Feed -->
            <div class="lg:col-span-2 flex flex-col gap-4">
                <h2 class="text-lg font-black text-gray-800 border-b pb-2">Order Feed</h2>
                <div id="orderFeed" class="flex flex-col gap-4">
                    <!-- Dynamic orders injected here -->
                </div>
            </div>

            <!-- Item Analytics -->
            <div class="flex flex-col gap-4">
                <div class="flex items-center justify-between border-b pb-2">
                    <h2 class="text-lg font-black text-gray-800">Item Analytics</h2>
                    <div class="flex bg-gray-200 rounded-lg p-1 gap-1">
                        <button onclick="setSort('desc')" id="btnSortDesc" class="px-2 py-1 text-xs font-bold rounded-md bg-white shadow-sm text-gray-800"><i class="fas fa-arrow-down"></i> Qty</button>
                        <button onclick="setSort('asc')" id="btnSortAsc" class="px-2 py-1 text-xs font-bold rounded-md text-gray-500 hover:text-gray-800"><i class="fas fa-arrow-up"></i> Qty</button>
                    </div>
                </div>
                <div id="itemAnalytics" class="flex flex-col gap-3">
                    <!-- Dynamic analytics injected here -->
                </div>
            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDLCvxFRNbKdoRpgSti2sAfxaTdws3IkX0",
            authDomain: "nalam-website.firebaseapp.com",
            projectId: "nalam-website",
            storageBucket: "nalam-website.firebasestorage.app",
            messagingSenderId: "557139585079",
            appId: "1:557139585079:web:de47feabeb5959504737b2"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let unsubscribe = null;
        let currentSort = 'desc';

        // Setup Dates
        const fromDateInput = document.getElementById('fromDate');
        const toDateInput = document.getElementById('toDate');

        function setDefaultDates() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const todayStr = `${yyyy}-${mm}-${dd}`;
            
            fromDateInput.value = todayStr;
            toDateInput.value = todayStr;
        }

        fromDateInput.addEventListener('change', loadData);
        toDateInput.addEventListener('change', loadData);

        function setSort(dir) {
            currentSort = dir;
            if (dir === 'desc') {
                document.getElementById('btnSortDesc').classList.add('bg-white', 'shadow-sm', 'text-gray-800');
                document.getElementById('btnSortDesc').classList.remove('text-gray-500');
                document.getElementById('btnSortAsc').classList.remove('bg-white', 'shadow-sm', 'text-gray-800');
                document.getElementById('btnSortAsc').classList.add('text-gray-500');
            } else {
                document.getElementById('btnSortAsc').classList.add('bg-white', 'shadow-sm', 'text-gray-800');
                document.getElementById('btnSortAsc').classList.remove('text-gray-500');
                document.getElementById('btnSortDesc').classList.remove('bg-white', 'shadow-sm', 'text-gray-800');
                document.getElementById('btnSortDesc').classList.add('text-gray-500');
            }
            // Trigger re-render of analytics
            renderAnalytics(window.lastAnalyticsData || []);
        }

        function loadData() {
            if (unsubscribe) {
                unsubscribe();
            }

            if (!fromDateInput.value || !toDateInput.value) return;

            const fromDate = new Date(fromDateInput.value);
            fromDate.setHours(0, 0, 0, 0);
            
            const toDate = new Date(toDateInput.value);
            toDate.setHours(23, 59, 59, 999);

            unsubscribe = db.collection('orders')
                .where('timestamp', '>=', fromDate)
                .where('timestamp', '<=', toDate)
                .orderBy('timestamp', 'desc')
                .onSnapshot(snapshot => {
                    processSnapshot(snapshot);
                }, error => {
                    console.error("Error fetching orders:", error);
                    document.getElementById('orderFeed').innerHTML = `<div class="text-red-500 font-bold p-4 text-center">Error fetching data. Check your Firebase rules.</div>`;
                });
        }

        function processSnapshot(snapshot) {
            let totalRev = 0;
            let totalCount = 0;
            const itemMap = {};

            const orderFeed = document.getElementById('orderFeed');
            orderFeed.innerHTML = '';

            if (snapshot.empty) {
                orderFeed.innerHTML = `<div class="text-center p-8 text-gray-500 font-bold">No orders found for this date range.</div>`;
            }

            snapshot.forEach(doc => {
                const data = doc.data();
                const id = doc.id;
                
                totalRev += data.grandTotal || 0;
                totalCount++;

                // Process item analytics
                if (data.items && Array.isArray(data.items)) {
                    data.items.forEach(item => {
                        const itemName = item.variant ? `${item.name} (${item.variant})` : item.name;
                        if (!itemMap[itemName]) {
                            itemMap[itemName] = { name: itemName, qty: 0, revenue: 0 };
                        }
                        itemMap[itemName].qty += item.quantity;
                        itemMap[itemName].revenue += item.subtotal;
                    });
                }

                // Render Order Card
                renderOrderCard(orderFeed, data, id);
            });

            document.getElementById('totalRevenue').innerText = `₹${totalRev}`;
            document.getElementById('totalOrders').innerText = totalCount;

            const analyticsArray = Object.values(itemMap);
            window.lastAnalyticsData = analyticsArray;
            renderAnalytics(analyticsArray);
        }

        function renderOrderCard(container, data, id) {
            const timeString = data.timestamp ? data.timestamp.toDate().toLocaleString() : 'Just now';
            
            let itemsHtml = '';
            if (data.items) {
                data.items.forEach(item => {
                    let variant = item.variant ? `<span class="text-[10px] text-orange-600 bg-orange-50 px-1.5 py-0.5 rounded ml-1 font-bold border border-orange-100">${item.variant}</span>` : '';
                    itemsHtml += `
                        <div class="flex justify-between items-center py-1.5 text-sm border-b border-gray-50 last:border-0">
                            <div class="flex items-center flex-wrap gap-1">
                                <span class="font-black text-gray-800 bg-gray-100 px-1.5 rounded">${item.quantity}x</span> 
                                <span class="font-semibold text-gray-700">${item.name}</span> 
                                ${variant}
                            </div>
                            <div class="font-bold text-gray-800">₹${item.subtotal}</div>
                        </div>
                    `;
                });
            }

            let offersHtml = '';
            if (data.unlockedOffers && data.unlockedOffers.length > 0) {
                offersHtml = `<div class="mt-3 text-xs font-bold text-green-700 bg-green-50 px-3 py-2 rounded-lg border border-green-100 flex gap-2 items-center">
                    <span class="text-sm">🎁</span>
                    <span>Offers Unlocked: ${data.unlockedOffers.join(', ')}</span>
                </div>`;
            }

            const card = document.createElement('div');
            card.className = "bg-white border border-gray-200 rounded-xl p-5 shadow-sm hover:shadow-md transition-shadow";
            card.innerHTML = `
                <div class="flex justify-between items-start mb-3 border-b pb-3">
                    <div>
                        <span class="text-xs font-bold text-gray-500 uppercase tracking-wider flex items-center gap-1"><i class="far fa-clock"></i> ${timeString}</span>
                    </div>
                    <button onclick="deleteOrder('${id}')" class="text-red-500 hover:text-red-700 hover:bg-red-50 p-1.5 rounded-lg transition-colors text-xs font-bold flex items-center gap-1">
                        <i class="fas fa-trash-alt"></i> Delete
                    </button>
                </div>
                <div class="mb-3">
                    ${itemsHtml}
                </div>
                <div class="border-t pt-3 flex flex-col gap-1.5 text-sm">
                    <div class="flex justify-between text-gray-500 font-medium">
                        <span>Item Total</span>
                        <span>₹${data.itemTotal || 0}</span>
                    </div>
                    <div class="flex justify-between text-gray-500 font-medium">
                        <span>Delivery Fee</span>
                        <span>${data.deliveryFee === 'FREE' ? '<span class="text-green-600 font-bold bg-green-50 px-1.5 rounded">FREE</span>' : '₹' + data.deliveryFee}</span>
                    </div>
                    <div class="flex justify-between text-gray-500 font-medium">
                        <span>Parcel Charge</span>
                        <span>₹${data.parcelCharge || 0}</span>
                    </div>
                    <div class="flex justify-between items-center mt-2 pt-2 border-t border-dashed">
                        <span class="font-black text-gray-800 text-lg">Grand Total</span>
                        <span class="font-black text-orange-600 text-xl">₹${data.grandTotal || 0}</span>
                    </div>
                </div>
                ${offersHtml}
            `;
            container.appendChild(card);
        }

        function renderAnalytics(dataArray) {
            const container = document.getElementById('itemAnalytics');
            container.innerHTML = '';

            dataArray.sort((a, b) => {
                if (currentSort === 'desc') return b.qty - a.qty;
                return a.qty - b.qty;
            });

            if (dataArray.length === 0) {
                container.innerHTML = `<div class="text-sm text-gray-500 text-center p-4">No data available</div>`;
                return;
            }

            dataArray.forEach(item => {
                const el = document.createElement('div');
                el.className = "bg-white border border-gray-100 rounded-lg p-3 shadow-sm flex justify-between items-center hover:bg-gray-50 transition-colors";
                el.innerHTML = `
                    <div class="flex-1">
                        <p class="text-sm font-bold text-gray-800">${item.name}</p>
                        <p class="text-xs font-semibold text-gray-500 mt-0.5">Sold: <span class="text-gray-900 font-black bg-gray-100 px-1 rounded">${item.qty}</span></p>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-black text-green-600 bg-green-50 px-2 py-1 rounded-lg">₹${item.revenue}</p>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function deleteOrder(id) {
            if (confirm("Are you sure you want to permanently delete this order?")) {
                db.collection('orders').doc(id).delete()
                  .catch(err => console.error("Error deleting order:", err));
            }
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            setDefaultDates();
            loadData();
        });

    </script>
</body>
</html>
