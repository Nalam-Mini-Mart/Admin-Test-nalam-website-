<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NalamHQ - Command Center</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .glass-panel { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
        }
        
        .glass-card { 
            background: rgba(15, 23, 42, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            transition: all 0.2s ease-in-out; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .glass-card:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 12px 25px -5px rgba(0, 0, 0, 0.4); 
            border-color: rgba(255, 255, 255, 0.1); 
        }

        .tab-btn { 
            transition: all 0.3s ease; 
            position: relative; 
            color: #94a3b8;
        }
        .tab-btn::after { 
            content: ''; 
            position: absolute; 
            bottom: -1px; 
            left: 0; 
            width: 0%; 
            height: 2px; 
            background-color: #3b82f6; 
            transition: width 0.3s ease; 
        }
        .tab-btn.active { color: #fff; }
        .tab-btn.active::after { width: 100%; }

        .tab-content { display: none; animation: fadeIn 0.3s ease forwards; }
        .tab-content.active { display: block; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .metric-value { 
            background: linear-gradient(to right, #60a5fa, #a78bfa); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans selection:bg-blue-500/30">

    <!-- Header -->
    <header class="glass-panel sticky top-0 z-50 px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
                <i class="fas fa-satellite-dish"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white tracking-tight">Nalam<span class="text-blue-400 font-normal">HQ</span></h1>
                <p class="text-[10px] text-slate-400 font-medium tracking-widest uppercase">Command Center</p>
            </div>
        </div>
        
        <div class="flex items-center gap-4 bg-slate-800/50 px-4 py-2 rounded-xl border border-slate-700/50">
            <div class="flex items-center gap-2">
                <i class="far fa-calendar-alt text-slate-400"></i>
                <input type="date" id="fromDate" class="bg-transparent border-none text-sm font-medium text-white focus:ring-0 cursor-pointer outline-none w-[120px]">
            </div>
            <span class="text-slate-600">→</span>
            <div class="flex items-center gap-2">
                <input type="date" id="toDate" class="bg-transparent border-none text-sm font-medium text-white focus:ring-0 cursor-pointer outline-none w-[120px]">
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-8">
        
        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Revenue -->
            <div class="glass-card rounded-2xl p-6 flex flex-col justify-between h-36 relative overflow-hidden group">
                <div class="absolute -right-6 -top-6 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl group-hover:bg-blue-500/20 transition-all"></div>
                <div class="flex justify-between items-start">
                    <p class="text-xs font-semibold text-slate-400 tracking-wider uppercase">Total Revenue</p>
                    <i class="fas fa-wallet text-blue-400 text-lg"></i>
                </div>
                <p class="text-4xl font-black metric-value tracking-tight" id="valRevenue">₹0</p>
            </div>
            
            <!-- Orders -->
            <div class="glass-card rounded-2xl p-6 flex flex-col justify-between h-36 relative overflow-hidden group">
                <div class="absolute -right-6 -top-6 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl group-hover:bg-indigo-500/20 transition-all"></div>
                <div class="flex justify-between items-start">
                    <p class="text-xs font-semibold text-slate-400 tracking-wider uppercase">Total Orders</p>
                    <i class="fas fa-shopping-bag text-indigo-400 text-lg"></i>
                </div>
                <p class="text-4xl font-black metric-value tracking-tight" id="valOrders">0</p>
            </div>
            
            <!-- Visits -->
            <div class="glass-card rounded-2xl p-6 flex flex-col justify-between h-36 relative overflow-hidden group">
                <div class="absolute -right-6 -top-6 w-32 h-32 bg-purple-500/10 rounded-full blur-2xl group-hover:bg-purple-500/20 transition-all"></div>
                <div class="flex justify-between items-start">
                    <p class="text-xs font-semibold text-slate-400 tracking-wider uppercase">Website Visits</p>
                    <i class="fas fa-eye text-purple-400 text-lg"></i>
                </div>
                <p class="text-4xl font-black metric-value tracking-tight" id="valVisits">0</p>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex gap-8 border-b border-slate-700/50 pb-px overflow-x-auto hide-scrollbar">
            <button class="tab-btn active pb-3 text-sm font-semibold tracking-wide whitespace-nowrap" data-target="tabOrders">
                <i class="fas fa-list-ul mr-2"></i>Order Feed
            </button>
            <button class="tab-btn pb-3 text-sm font-semibold tracking-wide whitespace-nowrap" data-target="tabAnalytics">
                <i class="fas fa-chart-pie mr-2"></i>Item Analytics
            </button>
            <button class="tab-btn pb-3 text-sm font-semibold tracking-wide whitespace-nowrap" data-target="tabVisits">
                <i class="fas fa-globe mr-2"></i>Website Visits
            </button>
            <button class="tab-btn pb-3 text-sm font-semibold tracking-wide whitespace-nowrap" data-target="tabAbandoned">
                <i class="fas fa-ghost mr-2"></i>Abandoned Carts
            </button>
            <button class="tab-btn pb-3 text-sm font-semibold tracking-wide whitespace-nowrap" data-target="tabClicks">
                <i class="fas fa-mouse-pointer mr-2"></i>Button Clicks
            </button>
        </div>

        <!-- Tab Contents -->
        <div class="min-h-[400px]">
            <!-- Tab 1: Orders -->
            <div id="tabOrders" class="tab-content active">
                <div id="ordersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>
            
            <!-- Tab 2: Analytics -->
            <div id="tabAnalytics" class="tab-content">
                <div id="analyticsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
            </div>
            
            <!-- Tab 3: Visits -->
            <div id="tabVisits" class="tab-content">
                <div class="glass-card rounded-2xl overflow-hidden max-w-3xl">
                    <ul id="visitsList" class="divide-y divide-slate-700/50"></ul>
                </div>
            </div>
            
            <!-- Tab 4: Abandoned Carts -->
            <div id="tabAbandoned" class="tab-content">
                <div id="cartsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>
            
            <!-- Tab 5: Clicks -->
            <div id="tabClicks" class="tab-content">
                <div class="glass-card rounded-2xl overflow-hidden max-w-3xl">
                    <ul id="clicksList" class="divide-y divide-slate-700/50"></ul>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- INSERT YOUR FIREBASE KEYS HERE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDLCvxFRNbKdoRpgSti2sAfxaTdws3IkX0",
            authDomain: "nalam-website.firebaseapp.com",
            projectId: "nalam-website",
            storageBucket: "nalam-website.firebasestorage.app",
            messagingSenderId: "557139585079",
            appId: "1:557139585079:web:de47feabeb5959504737b2"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        // --------------------------------------

        let unsubOrders, unsubVisits, unsubCarts, unsubClicks;

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            setDefaultDates();
            attachListeners();
            loadAllData();
        });

        function setDefaultDates() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const todayStr = `${yyyy}-${mm}-${dd}`;
            
            document.getElementById('fromDate').value = todayStr;
            document.getElementById('toDate').value = todayStr;
        }

        function attachListeners() {
            document.getElementById('fromDate').addEventListener('change', loadAllData);
            document.getElementById('toDate').addEventListener('change', loadAllData);

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    
                    e.currentTarget.classList.add('active');
                    document.getElementById(e.currentTarget.dataset.target).classList.add('active');
                });
            });
        }

        function loadAllData() {
            const fromStr = document.getElementById('fromDate').value;
            const toStr = document.getElementById('toDate').value;
            if(!fromStr || !toStr) return;

            const fromDate = new Date(fromStr); 
            fromDate.setHours(0, 0, 0, 0);
            
            const toDate = new Date(toStr); 
            toDate.setHours(23, 59, 59, 999);

            if (unsubOrders) unsubOrders();
            if (unsubVisits) unsubVisits();
            if (unsubCarts) unsubCarts();
            if (unsubClicks) unsubClicks();

            // 1. Orders
            unsubOrders = db.collection('orders')
                .where('timestamp', '>=', fromDate).where('timestamp', '<=', toDate)
                .orderBy('timestamp', 'desc')
                .onSnapshot(snap => processOrders(snap));

            // 2. Visits
            unsubVisits = db.collection('visits')
                .where('timestamp', '>=', fromDate).where('timestamp', '<=', toDate)
                .orderBy('timestamp', 'desc')
                .onSnapshot(snap => processVisits(snap));

            // 3. Abandoned Carts
            unsubCarts = db.collection('abandoned_carts')
                .where('timestamp', '>=', fromDate).where('timestamp', '<=', toDate)
                .orderBy('timestamp', 'desc')
                .onSnapshot(snap => processCarts(snap));

            // 4. Button Clicks
            unsubClicks = db.collection('button_clicks')
                .where('timestamp', '>=', fromDate).where('timestamp', '<=', toDate)
                .orderBy('timestamp', 'desc')
                .onSnapshot(snap => processClicks(snap));
        }

        // --- Data Processors ---

        function processOrders(snapshot) {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = '';
            let totalRev = 0, totalOrd = 0;
            const itemMap = {};

            if (snapshot.empty) {
                container.innerHTML = '<div class="col-span-full py-12 text-center text-slate-500 font-medium">No successful orders found for this date range.</div>';
            }

            snapshot.forEach(doc => {
                const data = doc.data();
                const id = doc.id;
                
                totalRev += data.grandTotal || 0;
                totalOrd++;
                
                // Aggregate items for Tab 2
                (data.items || []).forEach(it => {
                    const pureName = it.variant ? `${it.name} (${it.variant})` : it.name;
                    const htmlName = it.variant ? `${it.name} <span class="text-xs text-blue-400 bg-blue-400/10 px-1.5 py-0.5 rounded ml-1">${it.variant}</span>` : it.name;
                    
                    if(!itemMap[pureName]) itemMap[pureName] = { name: htmlName, qty: 0, rev: 0 };
                    itemMap[pureName].qty += it.quantity;
                    itemMap[pureName].rev += it.subtotal;
                });

                // Render Tab 1 Order Card
                renderOrderCard(container, data, id);
            });

            document.getElementById('valRevenue').innerText = '₹' + totalRev.toLocaleString();
            document.getElementById('valOrders').innerText = totalOrd.toLocaleString();

            renderAnalytics(Object.values(itemMap));
        }

        function processVisits(snapshot) {
            const count = renderList(snapshot, 'visitsList', 'fa-eye', null, 'Visit Logged');
            document.getElementById('valVisits').innerText = count.toLocaleString();
        }

        function processClicks(snapshot) {
            renderList(snapshot, 'clicksList', 'fa-mouse-pointer', 'button', 'Button Clicked');
        }

        function processCarts(snapshot) {
            const container = document.getElementById('cartsContainer');
            container.innerHTML = '';

            if (snapshot.empty) {
                container.innerHTML = '<div class="col-span-full py-12 text-center text-slate-500 font-medium">No abandoned carts found for this date range.</div>';
                return;
            }

            snapshot.forEach(doc => {
                const data = doc.data();
                const time = data.timestamp ? data.timestamp.toDate().toLocaleString() : 'N/A';
                
                const itemsHtml = (data.items || []).map(it => `
                    <div class="flex justify-between text-sm py-1.5 border-b border-slate-700/30 last:border-0">
                        <div class="text-slate-300">
                            <span class="font-bold text-white mr-2">${it.quantity}x</span> ${it.name} 
                            ${it.variant ? `<span class="text-[10px] text-slate-400 ml-1">(${it.variant})</span>` : ''}
                        </div>
                    </div>
                `).join('');

                container.insertAdjacentHTML('beforeend', `
                    <div class="glass-card rounded-2xl p-6 border-l-4 border-l-rose-500/50">
                        <div class="flex items-center gap-3 mb-4 pb-4 border-b border-slate-700/50">
                            <div class="w-8 h-8 rounded-lg bg-rose-500/10 flex items-center justify-center text-rose-400">
                                <i class="fas fa-ghost"></i>
                            </div>
                            <div class="flex-1">
                                <p class="text-xs font-bold text-slate-200 uppercase tracking-widest">Cart Abandoned</p>
                                <p class="text-xs text-slate-500 mt-0.5"><i class="far fa-clock mr-1"></i> ${time}</p>
                            </div>
                        </div>
                        <div class="space-y-1">${itemsHtml}</div>
                    </div>
                `);
            });
        }

        // --- Render Helpers ---

        function renderOrderCard(container, data, id) {
            const time = data.timestamp ? data.timestamp.toDate().toLocaleString() : 'N/A';
            const itemsHtml = (data.items || []).map(it => `
                <div class="flex justify-between text-sm py-2.5 border-b border-slate-700/30 last:border-0">
                    <div class="text-slate-300 flex-1">
                        <span class="font-bold text-white bg-slate-800 px-1.5 py-0.5 rounded text-xs mr-2">${it.quantity}x</span> 
                        ${it.name} 
                        ${it.variant ? `<span class="text-[10px] text-blue-400 font-bold bg-blue-400/10 px-1.5 py-0.5 rounded ml-1">${it.variant}</span>` : ''}
                    </div>
                    <div class="text-white font-semibold">₹${it.subtotal}</div>
                </div>
            `).join('');

            const offersHtml = (data.unlockedOffers && data.unlockedOffers.length) ? `
                <div class="mt-4 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-bold px-3 py-2.5 rounded-lg flex items-center gap-2">
                    <i class="fas fa-gift text-sm"></i> 
                    <span>Unlocked: ${data.unlockedOffers.join(', ')}</span>
                </div>
            ` : '';

            const card = `
                <div class="glass-card rounded-2xl p-6 flex flex-col h-full relative group">
                    <div class="flex justify-between items-start mb-4 pb-4 border-b border-slate-700/50">
                        <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-widest"><i class="far fa-clock mr-1"></i> ${time}</div>
                        <button onclick="deleteOrder('${id}')" class="text-slate-500 hover:text-rose-400 hover:bg-rose-400/10 p-1.5 rounded-md text-xs font-bold transition-all opacity-0 group-hover:opacity-100">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                    
                    <div class="flex-1 mb-4">
                        ${itemsHtml}
                    </div>
                    
                    <div class="space-y-2 text-sm text-slate-400 pt-4 border-t border-slate-700/50">
                        <div class="flex justify-between"><span>Item Total</span><span class="text-slate-200">₹${data.itemTotal||0}</span></div>
                        <div class="flex justify-between"><span>Delivery</span><span class="text-slate-200">${data.deliveryFee==='FREE'?'<span class="text-emerald-400 font-bold bg-emerald-400/10 px-1.5 py-0.5 rounded">FREE</span>': '₹'+data.deliveryFee}</span></div>
                        <div class="flex justify-between"><span>Parcel</span><span class="text-slate-200">₹${data.parcelCharge||0}</span></div>
                        
                        <div class="flex justify-between items-end pt-3 mt-2 border-t border-slate-700/50">
                            <span class="text-xs font-bold text-slate-300 uppercase tracking-wider">Grand Total</span>
                            <span class="text-2xl font-black text-blue-400">₹${data.grandTotal||0}</span>
                        </div>
                    </div>
                    ${offersHtml}
                </div>
            `;
            container.insertAdjacentHTML('beforeend', card);
        }

        function renderAnalytics(items) {
            const container = document.getElementById('analyticsGrid');
            container.innerHTML = '';
            
            // Sort highest qty first
            items.sort((a,b) => b.qty - a.qty);
            
            if(!items.length) {
                container.innerHTML = '<div class="col-span-full py-12 text-center text-slate-500 font-medium">No item data available for this period.</div>';
                return;
            }

            items.forEach(it => {
                container.insertAdjacentHTML('beforeend', `
                    <div class="glass-card rounded-2xl p-5 flex flex-col justify-between gap-4">
                        <div class="text-sm font-semibold text-slate-200 leading-snug">${it.name}</div>
                        <div class="flex justify-between items-end mt-2 pt-4 border-t border-slate-700/50">
                            <div>
                                <p class="text-[10px] text-slate-500 uppercase tracking-widest font-bold mb-1">Qty Sold</p>
                                <p class="text-xl font-black text-white">${it.qty}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[10px] text-slate-500 uppercase tracking-widest font-bold mb-1">Revenue</p>
                                <p class="text-xl font-black text-blue-400">₹${it.rev.toLocaleString()}</p>
                            </div>
                        </div>
                    </div>
                `);
            });
        }

        function renderList(snapshot, containerId, icon, labelKey, fallbackLabel) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            let count = 0;
            
            if (snapshot.empty) {
                container.innerHTML = '<li class="p-8 text-center text-slate-500 font-medium">No logs recorded for this period.</li>';
                return 0;
            }

            snapshot.forEach(doc => {
                count++;
                const data = doc.data();
                const time = data.timestamp ? data.timestamp.toDate().toLocaleString() : 'N/A';
                
                let labelHtml = '';
                if (labelKey && data[labelKey]) {
                    labelHtml = `<span class="text-white font-semibold ml-1 bg-slate-800 px-2 py-0.5 rounded-md border border-slate-700">${data[labelKey]}</span>`;
                }

                container.insertAdjacentHTML('beforeend', `
                    <li class="p-4 hover:bg-slate-700/20 transition-colors flex items-center justify-between group">
                        <div class="flex items-center text-sm text-slate-300">
                            <div class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center mr-4 text-blue-400 shadow-sm border border-slate-700/50">
                                <i class="fas ${icon}"></i>
                            </div>
                            <span class="font-medium">${fallbackLabel}</span> ${labelHtml}
                        </div>
                        <div class="text-xs text-slate-500 font-medium tracking-wide"><i class="far fa-clock mr-1"></i> ${time}</div>
                    </li>
                `);
            });
            return count;
        }

        function deleteOrder(id) {
            if (confirm("Permanently delete this order?")) {
                db.collection('orders').doc(id).delete()
                  .catch(err => console.error("Error deleting order:", err));
            }
        }
    </script>
</body>
</html>
